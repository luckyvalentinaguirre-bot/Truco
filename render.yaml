# =============================================================
# TRUCO · Blueprint de despliegue en Render (Infra as Code)
# -------------------------------------------------------------
# NO contiene secretos. Los valores sensibles (DATABASE_URL,
# CORS_ORIGINS, VITE_API_URL) se cargan como variables de entorno
# en el panel de Render, NUNCA en este archivo ni en el repo.
#
# La base de datos es externa (Neon); no se declara acá para no
# tocarla destructivamente. Ver docs/DEPLOYMENT.md.
# =============================================================
services:
  # ---- Backend: API HTTP (node:http nativo) ----
  - type: web
    name: truco-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      # Render inyecta PORT automáticamente; el server usa 10000 de fallback.
      - key: DATABASE_URL
        sync: false # se define en el panel; nunca en el repo
      - key: DATABASE_SSL
        value: require # Neon exige TLS
      - key: CORS_ORIGINS
        sync: false # p. ej. https://truco.<tu-dominio> — sin "*"

  # ---- Frontend: sitio estático (Vite build) ----
  - type: web
    name: truco-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false # URL pública del backend de Render (https://…)
    routes:
      # SPA: todas las rutas caen a index.html (React Router).
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
